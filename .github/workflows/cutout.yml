name: Détourage logos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/cutout-tot.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add media/brand && git commit -m "Logos Trick or Trade détourés" && git pull --rebase origin main && git push || echo rien
