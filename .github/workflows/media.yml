name: Images (logos, cartes, scelles)
on:
  workflow_dispatch:
  push:
    paths: ["scripts/build-media.mjs", ".github/workflows/media.yml"]
  schedule:
    - cron: "37 */6 * * *"
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-media.mjs
      - name: Publier
        run: |
          git config user.name "cote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media.json audit.json
          git diff --cached --quiet || (git commit -m "Images vérifiées et mises à jour" && git pull --rebase && git push)
      - name: Republier le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
