name: Raretés des extensions
on:
  workflow_dispatch:
  push:
    paths: ["scripts/build-rarities.mjs", ".github/workflows/rarities.yml"]
  schedule:
    - cron: "41 5,13,21 * * *"
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-rarities.mjs
      - name: Publier les raretés
        run: |
          git config user.name "cote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rarities.json
          git diff --cached --quiet || (git commit -m "Raretés des extensions mises à jour" && git pull --rebase && git push)
      - name: Republier le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
