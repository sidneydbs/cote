name: Top 100 des cartes à chasser
on:
  workflow_dispatch:
  push:
    paths: ["scripts/build-top.mjs", ".github/workflows/top.yml"]
  schedule:
    - cron: "53 0,8,16 * * *"
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-top.mjs
      - name: Publier le top 100
        run: |
          git config user.name "cote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top.json
          git diff --cached --quiet || (git commit -m "Top 100 des cartes à chasser mis à jour" && git pull --rebase && git push)
      - name: Republier le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
